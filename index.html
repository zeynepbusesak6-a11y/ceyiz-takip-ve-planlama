<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Çeyiz Takip ve Planlama</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#fffaf7;
color:#5a443b;
font-family:Arial,sans-serif;
}

header{
background:linear-gradient(135deg,#d99da5,#e8b8bd);
color:white;
text-align:center;
padding:25px 15px;
}

.logo{
margin:auto auto 8px;
width:70px;
height:70px;
border:2px solid white;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font:46px Georgia;
color:#fff3c9;
text-shadow:0 1px 2px #80632f;
}

h1{
margin:0;
font:30px Georgia;
}

.subtitle{
margin-top:7px;
font-size:14px;
}

nav{
display:flex;
background:white;
position:sticky;
top:0;
z-index:10;
border-bottom:1px solid #eadbd7;
}

nav button{
flex:1;
border:0;
background:white;
padding:15px 8px;
font-size:15px;
color:#80675d;
cursor:pointer;
}

nav button.active{
color:#b76f78;
font-weight:bold;
border-bottom:3px solid #dda4ab;
}

main{
max-width:1000px;
margin:auto;
padding:20px 15px 70px;
}

.section{
display:block;
}

.hidden{
display:none!important;
}

.box{
background:white;
border:1px solid #eadbd7;
border-radius:18px;
padding:18px;
margin-bottom:18px;
box-shadow:0 3px 12px rgba(90,68,59,.05);
}

h2{
font:24px Georgia;
margin:0 0 15px;
}

h3{
font:19px Georgia;
margin:0 0 12px;
}

.grid{
display:grid;
grid-template-columns:2fr 1fr 1fr;
gap:10px;
}

input,
select,
textarea{
width:100%;
padding:13px;
border:1px solid #dfceca;
border-radius:10px;
font-size:15px;
background:#fffdfc;
color:#5a443b;
}

textarea{
min-height:80px;
resize:vertical;
}

.full{
grid-column:1/-1;
}

.primary{
width:100%;
padding:14px;
border:0;
border-radius:11px;
background:#dda4ab;
color:white;
font-size:15px;
font-weight:bold;
cursor:pointer;
}

.secondary{
border:1px solid #dfceca;
background:white;
color:#80675d;
border-radius:9px;
padding:10px 13px;
cursor:pointer;
}

.cancel{
background:#f5ebe8;
margin-top:8px;
}

.summary{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
}

.stat{
background:#fff7f5;
border:1px solid #eadbd7;
border-radius:14px;
padding:15px;
text-align:center;
}

.stat strong{
display:block;
font-size:25px;
color:#b76f78;
margin-bottom:5px;
}

.stat span{
font-size:12px;
color:#927d74;
}

.progress{
height:13px;
background:#f0e3df;
border-radius:20px;
overflow:hidden;
margin-top:10px;
}

.progress-bar{
height:100%;
background:#dda4ab;
width:0%;
transition:.3s;
}

.tools{
display:grid;
grid-template-columns:2fr 1fr 1fr;
gap:10px;
margin-bottom:15px;
}

.item{
display:flex;
gap:14px;
padding:15px 0;
border-bottom:1px solid #eee2df;
align-items:center;
}

.item:last-child{
border-bottom:0;
}

.photo{
width:90px;
height:90px;
border-radius:13px;
object-fit:cover;
background:#f7eeee;
border:1px solid #eadbd7;
flex-shrink:0;
}

.no-photo{
width:90px;
height:90px;
border-radius:13px;
background:#f7eeee;
display:flex;
align-items:center;
justify-content:center;
font-size:34px;
flex-shrink:0;
}

.info{
flex:1;
min-width:0;
}

.name{
font:19px Georgia;
font-weight:bold;
word-break:break-word;
}

.meta{
font-size:13px;
color:#927d74;
margin-top:6px;
line-height:1.5;
}

.badge{
display:inline-block;
background:#f5dfe2;
color:#9a6068;
border-radius:15px;
padding:4px 8px;
margin:2px 4px 2px 0;
}

.favorite{
font-size:23px;
border:0;
background:transparent;
cursor:pointer;
padding:3px;
}

.actions{
display:flex;
gap:6px;
flex-wrap:wrap;
justify-content:flex-end;
}

.actions button{
padding:8px 10px;
border-radius:9px;
font-size:13px;
cursor:pointer;
}

.buy{
border:0;
background:#e7eee5;
color:#587051;
}

.edit{
border:1px solid #d8c8c3;
background:white;
color:#80675d;
}

.delete{
border:1px solid #e0bfc3;
background:white;
color:#b26d76;
}

.empty{
text-align:center;
color:#9b8982;
padding:35px 15px;
}

.big{
font-size:42px;
margin-bottom:8px;
}

.preview{
width:110px;
height:110px;
object-fit:cover;
border-radius:14px;
border:1px solid #eadbd7;
display:none;
margin-top:8px;
}

.fav-filter{
display:flex;
gap:8px;
margin-bottom:15px;
}

.fav-filter button{
padding:8px 12px;
border-radius:20px;
border:1px solid #dfceca;
background:white;
cursor:pointer;
color:#80675d;
}

.fav-filter button.active{
background:#f5dfe2;
color:#9a6068;
}

.detail-modal{
position:fixed;
inset:0;
background:rgba(60,40,35,.45);
display:flex;
align-items:center;
justify-content:center;
padding:20px;
z-index:50;
}

.detail-card{
background:white;
width:min(600px,100%);
max-height:90vh;
overflow:auto;
border-radius:20px;
padding:20px;
}

.detail-photo{
width:100%;
max-height:350px;
object-fit:contain;
border-radius:15px;
background:#faf3f1;
margin-bottom:15px;
}

.close{
float:right;
border:0;
background:#f5ebe8;
border-radius:50%;
width:35px;
height:35px;
font-size:20px;
cursor:pointer;
}

.link{
color:#b76f78;
text-decoration:none;
}

@media(max-width:750px){

.grid{
grid-template-columns:1fr;
}

.tools{
grid-template-columns:1fr;
}

.summary{
grid-template-columns:repeat(2,1fr);
}

.item{
align-items:flex-start;
}

.actions{
justify-content:flex-start;
width:100%;
}

}

@media(max-width:500px){

.item{
flex-direction:column;
}

.photo,
.no-photo{
width:100%;
height:180px;
}

.actions button{
flex:1;
}

h1{
font-size:25px;
}

}

</style>
</head>

<main>


<!-- ANA SAYFA -->

<section
id="home"
class="section">

<div class="box">

<h2>
Çeyiz Özeti
</h2>

<div class="summary">

<div class="stat">

<strong id="statShopping">
0
</strong>

<span>
Alınacak ürün
</span>

</div>


<div class="stat">

<strong id="statProducts">
0
</strong>

<span>
Alınmış ürün
</span>

</div>


<div class="stat">

<strong id="statShoppingMoney">
₺0
</strong>

<span>
Tahmini tutar
</span>

</div>


<div class="stat">

<strong id="statProductsMoney">
₺0
</strong>

<span>
Harcanan tutar
</span>

</div>

</div>

</div>


<div class="box">

<h2>
Çeyiz İlerlemesi
</h2>

<div id="progressText">
0% tamamlandı
</div>

<div class="progress">

<div
id="progressBar"
class="progress-bar">
</div>

</div>

</div>

<h2>

<!-- DETAY PENCERESİ -->

×

</div>

</div>



<script>


/* =========================
   VERİLER
========================= */


const STORAGE_KEY =
"ceyiz_takip_complete_v1";


let app;


try{

app =
JSON.parse(
localStorage.getItem(STORAGE_KEY)
||
'{"shopping":[],"products":[],"budget":0}'
);

}catch(error){

app={
shopping:[],
products:[],
budget:0
};

}


let editing={
shopping:null,
products:null
};


let imageData={
shopping:null,
products:null
};



/* =========================
   KAYDET
========================= */


function save(){

localStorage.setItem(
STORAGE_KEY,
JSON.stringify(app)
);

}



/* =========================
   SEKME
========================= */


function showTab(tab){

const sections=[
"home",
"shopping",
"products",
"favorites"
];

sections.forEach(
id=>{
document
.getElementById(id)
.classList.toggle(
"hidden",
id!==tab
);
}
);


document
.querySelectorAll("nav button")
.forEach(
button =>
button.classList.remove("active")
);


const map={
home:"tabHome",
shopping:"tabShopping",
products:"tabProducts",
favorites:"tabFavorites"
};


document
.getElementById(map[tab])
.classList.add("active");


render();

}



/* =========================
   GÜVENLİ METİN
========================= */


function esc(value){

return String(value ?? "")
.replace(/[&<>"']/g,function(m){

return{

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[m];

});

}



/* =========================
   PARA
========================= */


function money(value){

return Number(value||0)
.toLocaleString(
"tr-TR",
{
style:"currency",
currency:"TRY"
}
);

}



/* =========================
   RESİM ÖNİZLEME
========================= */


function previewImage(inputId,previewId){

const input =
document.getElementById(inputId);

const preview =
document.getElementById(previewId);


if(!input.files || !input.files[0]){

return;

}


const reader =
new FileReader();


reader.onload=function(e){

preview.src=e.target.result;

preview.style.display="block";

imageData[
inputId==="si"
?"shopping"
:"products"
]=e.target.result;

};


reader.readAsDataURL(
input.files[0]
);

}



/* =========================
   ALANLAR
========================= */


function getFields(type){

const p =
type==="shopping"
?"s"
:"p";


return{

name:document.getElementById(p+"n"),

qty:document.getElementById(p+"q"),

price:document.getElementById(p+"p"),

category:document.getElementById(p+"c"),

store:document.getElementById(p+"s"),

link:document.getElementById(p+"l"),

note:document.getElementById(p+"t")

};

}



/* =========================
   FORM TEMİZLE
========================= */


function clearForm(type){

const f =
getFields(type);


f.name.value="";

f.qty.value="1";

f.price.value="";

f.category.value="";

f.store.value="";

f.link.value="";

f.note.value="";


const input =
document.getElementById(
type==="shopping"
?"si"
:"pi"
);


const preview =
document.getElementById(
type==="shopping"
?"sPreview"
:"pPreview"
);


input.value="";

preview.src="";

preview.style.display="none";


imageData[type]=null;

editing[type]=null;


document
.getElementById(
type==="shopping"
?"shoppingTitle"
:"productsTitle"
)
.textContent =
type==="shopping"
?"Alınacak Ürün Ekle"
:"Ürün Ekle";


document
.getElementById(
type==="shopping"
?"shoppingAdd"
:"productsAdd"
)
.textContent =
type==="shopping"
?"+ Alınacaklara Ekle"
:"+ Ürünlere Ekle";


document
.getElementById(
type==="shopping"
?"shoppingCancel"
:"productsCancel"
)
.classList.add("hidden");

}



/* =========================
   ÜRÜN EKLE / GÜNCELLE
========================= */


function saveItem(type){

const f =
getFields(type);


const name =
f.name.value.trim();


if(!name){

alert(
"Lütfen ürün adını yaz."
);

f.name.focus();

return;

}


const item={

name:name,

qty:Number(f.qty.value)||1,

price:Number(f.price.value)||0,

category:f.category.value,

store:f.store.value.trim(),

link:f.link.value.trim(),

note:f.note.value.trim(),

image:
imageData[type] || "",

favorite:false

};


if(editing[type]!==null){

const index =
app[type].findIndex(
x =>
String(x.id)
===
String(editing[type])
);


if(index>=0){

item.id=
app[type][index].id;

item.favorite=
app[type][index].favorite||false;

if(!imageData[type]){

item.image=
app[type][index].image||"";

}

app[type][index]=item;

}

}else{

item.id=
Date.now()
+
Math.floor(
Math.random()*10000
);

app[type].push(item);

}


save();

clearForm(type);

render();

}



/* =========================
   DÜZENLE
========================= */


function editItem(type,id){

const item =
app[type].find(
x =>
String(x.id)
===
String(id)
);


if(!item){

return;

}


const f =
getFields(type);


f.name.value=
item.name||"";

f.qty.value=
item.qty||1;

f.price.value=
item.price||"";

f.category.value=
item.category||"";

f.store.value=
item.store||"";

f.link.value=
item.link||"";

f.note.value=
item.note||"";


imageData[type]=
item.image||null;


const preview =
document.getElementById(
type==="shopping"
?"sPreview"
:"pPreview"
);


if(item.image){

preview.src=item.image;

preview.style.display="block";

}


editing[type]=item.id;


document
.getElementById(
type==="shopping"
?"shoppingTitle"
:"productsTitle"
)
.textContent=
"Ürünü Düzenle";


document
.getElementById(
type==="shopping"
?"shoppingAdd"
:"productsAdd"
)
.textContent=
"✓ Değişiklikleri Kaydet";


document
.getElementById(
type==="shopping"
?"shoppingCancel"
:"productsCancel"
)
.classList.remove("hidden");


showTab(type);

window.scrollTo({
top:0,
behavior:"smooth"
});

}



/* =========================
   DÜZENLEMEYİ İPTAL
========================= */


function cancelEdit(type){

clearForm(type);

}



/* =========================
   FAVORİ
========================= */


function toggleFavorite(type,id){

const item =
app[type].find(
x =>
String(x.id)
===
String(id)
);


if(!item){

return;

}


item.favorite=
!item.favorite;


save();

render();

}



/* =========================
   ALDIM
========================= */


function markBought(id){

const index =
app.shopping.findIndex(
x =>
String(x.id)
===
String(id)
);


if(index<0){

return;

}


const item =
app.shopping[index];


app.products.push({

...item,

id:
Date.now()
+
Math.floor(
Math.random()*10000
)

});


app.shopping.splice(
index,
1
);


save();

render();


alert(
"Ürün, Ürünler bölümüne taşındı. ✓"
);

}



/* =========================
   SİL
========================= */


function deleteItem(type,id){

if(
!confirm(
"Bu ürünü silmek istediğine emin misin?"
)
){

return;

}


const before =
app[type].length;


app[type]=
app[type].filter(
x =>
String(x.id)
!==
String(id)
);


if(
app[type].length===before
){

return;

}


save();

render();

}



/* =========================
   ARAMA / FİLTRE
========================= */


function filtered(type){

const searchId =
type==="shopping"
?"searchShopping"
:"searchProducts";


const filterId =
type==="shopping"
?"filterShopping"
:"filterProducts";


const favId =
type==="shopping"
?"favoriteShoppingFilter"
:"favoriteProductsFilter";


const search =
document
.getElementById(searchId)
.value
.toLowerCase()
.trim();


const category =
document
.getElementById(filterId)
.value;


const favorite =
document
.getElementById(favId)
.value;


return app[type].filter(item=>{

const text=
(
item.name
+
" "
+
item.category
+
" "
+
item.store
+
" "
+
item.note
).toLowerCase();


return(

!search
||
text.includes(search)

)

&&

(

!category
||
item.category===category

)

&&

(

!favorite
||
item.favorite===true

);

});

}



/* =========================
   KART
========================= */


function card(item,type){

const photo =
item.image

?

`<img
class="photo"
src="${item.image}"
alt="${esc(item.name)}">`

:

`<div class="no-photo">
📦
</div>`;


const store =
item.store
?
(
item.link
?

` · <a
class="link"
target="_blank"
href="${esc(item.link)}">
${esc(item.store)}
</a>`

:

` · ${esc(item.store)}`
)

:"";


return`

<div class="item">


${photo}


<div class="info">


<div class="name">

${esc(item.name)}

</div>


<div class="meta">


<span class="badge">

${item.qty} adet

</span>


${
item.price
?

`<span class="badge">
${money(item.price)}
</span>`

:""
}


${
item.category
?

`<span class="badge">
${esc(item.category)}
</span>`

:""
}


${store}


</div>


${
item.note
?

`<div class="meta">
📝 ${esc(item.note)}
</div>`

:""
}


</div>


<button
class="favorite"
title="Favori">

${item.favorite?"❤️":"♡"}

</button>


<div class="actions">


<button
class="edit"
onclick="openDetail('${type}','${item.id}')">

Detay

</button>


<button
class="edit"
onclick="editItem('${type}','${item.id}')">

✎ Düzenle

</button>


${
type==="shopping"

?

`<button
class="buy"
onclick="markBought('${item.id}')">

✓ Aldım

</button>`

:""
}


<button
class="delete"
onclick="deleteItem('${type}','${item.id}')">

Sil

</button>


</div>


</div>

`;

}



/* =========================
   FAVORİ KARTLARI
========================= */


function favoriteCards(){

const all=[
...app.shopping.map(x=>({...x,_type:"shopping"})),
...app.products.map(x=>({...x,_type:"products"}))
];


const favorites =
all.filter(
x=>x.favorite
);


if(!favorites.length){

return`

<div class="empty">

<div class="big">
❤️
</div>

Henüz favori ürünün yok.

</div>

`;

}


return favorites
.map(x=>card(x,x._type))
.join("");

}



/* =========================
   DETAY
========================= */


function openDetail(type,id){

const item =
app[type].find(
x =>
String(x.id)
===
String(id)
);


if(!item){

return;

}


let html="";


if(item.image){

html+=
`<img
class="detail-photo"
src="${item.image}"
alt="${esc(item.name)}">`;

}else{

html+=
`<div
class="no-photo"
style="width:100%;height:220px;margin-bottom:15px">
📦
</div>`;

}


html+=
`<h2>${esc(item.name)}</h2>`;


html+=
`<p>
<span class="badge">
${item.qty} adet
</span>
</p>`;


if(item.category){

html+=
`<p>
<b>Kategori:</b>
${esc(item.category)}
</p>`;

}


if(item.price){

html+=
`<p>
<b>Fiyat:</b>
${money(item.price)}
</p>`;

}


if(item.store){

html+=
`<p>
<b>Mağaza:</b>
${esc(item.store)}
</p>`;

}


if(item.link){

html+=
`<p>
<a
class="link"
target="_blank"
href="${esc(item.link)}">
🔗 Ürün bağlantısını aç
</a>
</p>`;

}


if(item.note){

html+=
`<p>
<b>Not:</b><br>
${esc(item.note)}
</p>`;

}


html+=
`<p>
<b>Durum:</b>
${type==="shopping"
?"Alınacak"
:"Alındı"}
</p>`;


document
.getElementById("detailContent")
.innerHTML=html;


document
.getElementById("detailModal")
.classList.remove("hidden");

}



/* =========================
   DETAY KAPAT
========================= */


function closeDetail(event){

if(
event
&&
event.target
!==
document.getElementById(
"detailModal"
)
){

return;

}


document
.getElementById("detailModal")
.classList.add("hidden");

}



/* =========================
   BÜTÇE
========================= */


function saveBudget(){

const value =
Number(
document
.getElementById("budgetInput")
.value
)||0;


app.budget=value;

save();

render();

alert(
"Bütçe kaydedildi. 💰"
);

}



/* =========================
   ANA ÖZET
========================= */


function updateSummary(){

const shoppingCount =
app.shopping.length;


const productsCount =
app.products.length;


const shoppingMoney =
app.shopping.reduce(
(total,item)=>
total
+
(
Number(item.price)||0
)
*
(
Number(item.qty)||1
),
0
);


const productsMoney =
app.products.reduce(
(total,item)=>
total
+
(
Number(item.price)||0
)
*
(
Number(item.qty)||1
),
0
);


const total =
shoppingCount
+
productsCount;


const progress =
total
?

Math.round(
(productsCount/total)*100
)

:0;


document
.getElementById("statShopping")
.textContent=
shoppingCount;


document
.getElementById("statProducts")
.textContent=
productsCount;


document
.getElementById("statShoppingMoney")
.textContent=
money(shoppingMoney);


document
.getElementById("statProductsMoney")
.textContent=
money(productsMoney);


document
.getElementById("progressText")
.textContent=
progress
+
"% tamamlandı";


document
.getElementById("progressBar")
.style.width=
progress+"%";


const budgetInfo =
document
.getElementById("budgetInfo");


if(app.budget){

const totalSpent =
productsMoney;


const remaining =
app.budget-totalSpent;


budgetInfo.innerHTML=
"Toplam bütçe: <b>"
+
money(app.budget)
+
"</b><br>"
+
"Harcanan: <b>"
+
money(totalSpent)
+
"</b><br>"
+
"Kalan: <b>"
+
money(remaining)
+
"</b>";

}else{

budgetInfo.textContent=
"Henüz bütçe belirlenmedi.";

}

}



/* =========================
   EKRANI ÇİZ
========================= */


function render(){

const shopping =
filtered("shopping");


const products =
filtered("products");


document
.getElementById("shoppingList")
.innerHTML=

shopping.length

?

shopping
.map(
x=>card(x,"shopping")
)
.join("")

:

`<div class="empty">
<div class="big">🛒</div>
Alınacaklar listen boş.
</div>`;


document
.getElementById("productList")
.innerHTML=

products.length

?

products
.map(
x=>card(x,"products")
)
.join("")

:

`<div class="empty">
<div class="big">📦</div>
Henüz ürün eklenmedi.
</div>`;


document
.getElementById("favoriteList")
.innerHTML=
favoriteCards();


updateSummary();

}



/* =========================
   BAŞLANGIÇ
========================= */


render();

</script>

</body>
</html>
